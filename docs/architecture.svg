<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L11,6 L0,12 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: bold; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .group { font-size: 13px; font-weight: bold; }
      .edge { font-size: 12px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
      .dash { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- groups -->
  <rect x="20" y="115" width="340" height="375" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="344" y="478" text-anchor="end" class="group" fill="#1d4ed8">metamorphic_testing — adapteri</text>

  <rect x="480" y="115" width="500" height="375" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="496" y="142" class="group" fill="#15803d">metamorphic_testing_core — jezgro</text>

  <!-- runner -->
  <rect x="330" y="20" width="340" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="44" text-anchor="middle" class="title">test_run (runner/test.cpp)</text>
  <text x="500" y="63" text-anchor="middle" class="sub">argumenti, seme, pokretanje svih relacija</text>

  <!-- input pdf -->
  <path d="M45,20 H165 L185,38 V76 H45 z" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="115" y="53" text-anchor="middle" class="title">file.pdf</text>

  <!-- adapters -->
  <rect x="45" y="165" width="290" height="56" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="189" text-anchor="middle" class="title">pdf::split_pages</text>
  <text x="190" y="208" text-anchor="middle" class="sub">qpdf: PDF → PDF-ovi od po jedne strane</text>

  <rect x="45" y="280" width="290" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="304" text-anchor="middle" class="title">ElasticsearchSearchClient</text>
  <text x="190" y="322" text-anchor="middle" class="sub">index_document · query · get_tokens</text>
  <text x="190" y="339" text-anchor="middle" class="sub">implementira SearchEngineClient</text>

  <!-- tokens.txt -->
  <path d="M375,295 H450 L465,308 V335 H375 z" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="420" y="320" text-anchor="middle" class="sub" font-weight="bold">tokens.txt</text>

  <!-- core -->
  <rect x="500" y="165" width="190" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="595" y="189" text-anchor="middle" class="title">MetamorphicRelation ×8</text>
  <text x="595" y="208" text-anchor="middle" class="sub">generate · mutate · holds</text>

  <rect x="770" y="165" width="190" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="865" y="189" text-anchor="middle" class="title">Verifier</text>
  <text x="865" y="208" text-anchor="middle" class="sub">verify_relation</text>

  <rect x="500" y="287" width="190" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="595" y="311" text-anchor="middle" class="title">TokenGenerator</text>
  <text x="595" y="330" text-anchor="middle" class="sub">rečnik + mt19937(seme)</text>

  <rect x="500" y="400" width="190" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="595" y="424" text-anchor="middle" class="title">DummySearchClient</text>
  <text x="595" y="443" text-anchor="middle" class="sub">na svaki upit vraća {1}</text>

  <rect x="770" y="400" width="190" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="865" y="421" text-anchor="middle" class="sub">«interfejs»</text>
  <text x="865" y="441" text-anchor="middle" class="title">SearchEngineClient</text>

  <!-- external -->
  <path d="M80,545 A110,14 0 0 1 300,545 V592 A110,14 0 0 1 80,592 z" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M80,545 A110,14 0 0 0 300,545" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="190" y="576" text-anchor="middle" class="title">Elasticsearch 8.15</text>
  <text x="190" y="594" text-anchor="middle" class="sub">Docker</text>

  <rect x="770" y="530" width="190" height="46" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="865" y="552" text-anchor="middle" class="title">tests/</text>
  <text x="865" y="569" text-anchor="middle" class="sub">Catch2 jedinični testovi</text>

  <!-- edges -->
  <path d="M115,76 V165" class="line" marker-end="url(#arrow)"/>
  <path d="M330,48 H290 V165" class="line" marker-end="url(#arrow)"/>
  <text x="298" y="100" class="edge">① podela na strane</text>

  <path d="M190,221 V280" class="line" marker-end="url(#arrow)"/>
  <text x="200" y="256" class="edge">② strana = dokument</text>

  <path d="M110,350 V537" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="120" y="515" class="edge">HTTP / JSON</text>

  <path d="M335,315 H375" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="285" text-anchor="middle" class="edge">③ get_tokens()</text>
  <path d="M465,315 H500" class="line" marker-end="url(#arrow)"/>

  <path d="M595,287 V221" class="line" marker-end="url(#arrow)"/>
  <text x="603" y="260" class="edge">tokeni</text>

  <path d="M670,48 H865 V165" class="line" marker-end="url(#arrow)"/>
  <text x="873" y="100" class="edge">④ za svaku relaciju</text>

  <path d="M770,193 H690" class="line" marker-end="url(#arrow)"/>
  <text x="730" y="185" text-anchor="middle" class="edge">q, q'</text>

  <path d="M865,221 V400" class="line" marker-end="url(#arrow)"/>
  <text x="873" y="305" class="edge">⑤ query(q, op)</text>
  <text x="890" y="321" class="edge">query(q', op)</text>

  <path d="M690,428 H770" class="dash" marker-end="url(#realize)"/>
  <text x="730" y="418" text-anchor="middle" class="edge">u testovima</text>

  <path d="M820,456 V505 H420 V340 H335" class="line" marker-end="url(#arrow)"/>
  <text x="620" y="522" text-anchor="middle" class="edge">⑥ u test_run upiti idu na ElasticsearchSearchClient</text>

  <path d="M865,530 V490" class="line" marker-end="url(#arrow)"/>
  <text x="873" y="514" class="edge">testira jezgro</text>
</svg>
